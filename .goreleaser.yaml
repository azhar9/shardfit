version: 2
project_name: shardfit

builds:
  - main: ./cmd/shardfit
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - "-s"
      - "-w"
      - "-X"
      - "main.version={{.Version}}"

archives:
  # versionless asset names so docs can link releases/latest/download/…
  # (each release replaces the previous shardfit_<os>_<arch> asset)
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  draft: false

changelog:
  use: git
  # no author emails in public release notes
  format: "{{.Message}} ({{.ShortHash}})"
