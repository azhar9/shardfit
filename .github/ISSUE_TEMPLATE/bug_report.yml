name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: shardfit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Adapter
      placeholder: "pytest / jest / junit / xunit / generic"
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The exact command line and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: stderr/stdout of the failing command (redact secrets)
      render: text
